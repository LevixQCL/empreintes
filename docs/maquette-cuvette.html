html,body{margin:0;height:100%;background:#5e9480;overflow:hidden;font-family:system-ui,sans-serif}

.mer{filter:url(#houle)}

.g{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
